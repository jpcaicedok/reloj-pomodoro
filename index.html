<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reloj Pomodoro</title>
  <style>
    :root { color-scheme: light dark; --fondo: #f7f5f1; --texto: #1f1c1a; --suave: #68625c; --panel: #fff; --borde: #ddd8d0; --acento: #b83c28; --sobre-acento: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #161413; --texto: #f4f1ee; --suave: #aca69f; --panel: #211e1c; --borde: #3b3633; --acento: #ff9682; --sobre-acento: #2a0f09; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 420px); background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 24px; text-align: center; }
    h1 { margin: 0; font-size: 1.1rem; }
    #fase { margin: 16px 0 0; color: var(--suave); font-weight: 600; }
    #tiempo { margin: 0 0 16px; font-size: clamp(3.5rem, 20vw, 5rem); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .botones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button { min-height: 44px; font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid var(--borde); background: transparent; color: inherit; }
    button.principal { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    h2 { margin: 24px 0 8px; font-size: 1rem; text-align: left; }
    #resumen { margin: 0 0 12px; color: var(--suave); text-align: left; }
    ul { list-style: none; margin: 0 0 12px; padding: 0; text-align: left; font-variant-numeric: tabular-nums; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--borde); }
    .acciones { display: grid; gap: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Reloj Pomodoro</h1>
    <p id="fase" aria-live="polite"></p>
    <p id="tiempo" role="timer"></p>
    <div class="botones">
      <button id="alternar" class="principal" type="button">Iniciar</button>
      <button id="saltar" type="button">Saltar</button>
      <button id="reiniciar" type="button">Reiniciar</button>
    </div>
    <h2>Historial</h2>
    <p id="resumen"></p>
    <ul id="lista"></ul>
    <div class="acciones">
      <button id="exportar" type="button">Exportar a CSV</button>
      <button id="borrar" type="button">Borrar historial</button>
    </div>
  </main>

  <script id="nucleo">
    const DURACIONES = { trabajo: 25 * 60, descanso: 5 * 60, largo: 15 * 60 };
    const NOMBRES = { trabajo: "Concentración", descanso: "Descanso corto", largo: "Descanso largo" };
    const CICLOS_HASTA_LARGO = 4;

    function siguienteFase(fase, completados) {
      if (fase !== "trabajo") return "trabajo";
      return completados > 0 && completados % CICLOS_HASTA_LARGO === 0 ? "largo" : "descanso";
    }

    function formatearTiempo(segundos) {
      const total = Math.max(0, Math.ceil(segundos));
      const minutos = String(Math.floor(total / 60)).padStart(2, "0");
      return minutos + ":" + String(total % 60).padStart(2, "0");
    }

    function resumirHoy(historial, ahora) {
      const hoy = new Date(ahora).toDateString();
      const sesiones = historial.filter((s) => new Date(s.fin).toDateString() === hoy);
      const minutos = sesiones.reduce((suma, s) => suma + s.minutos, 0);
      return { sesiones: sesiones.length, minutos: minutos };
    }

    function historialACSV(historial) {
      const filas = historial.map((s) => new Date(s.fin).toISOString() + "," + s.minutos);
      return ["fin,minutos"].concat(filas).join("\r\n") + "\r\n";
    }
  </script>

  <script>
    const CLAVE = "reloj-pomodoro-historial";
    const el = (id) => document.getElementById(id);
    let historial = cargar();
    let fase = "trabajo";
    let completados = 0;
    let restante = DURACIONES.trabajo;
    let finEn = null;
    let intervalo = null;

    function cargar() {
      try {
        const datos = JSON.parse(localStorage.getItem(CLAVE));
        return Array.isArray(datos) ? datos : [];
      } catch {
        return [];
      }
    }

    function guardar() {
      try {
        localStorage.setItem(CLAVE, JSON.stringify(historial));
      } catch {
        /* Sin almacenamiento, el historial dura solo mientras la página siga abierta. */
      }
    }

    function pintar() {
      const texto = formatearTiempo(restante);
      el("tiempo").textContent = texto;
      el("fase").textContent = NOMBRES[fase];
      el("alternar").textContent = finEn ? "Pausar" : "Iniciar";
      document.title = texto + " · " + NOMBRES[fase];
    }

    function pintarHistorial() {
      const hoy = resumirHoy(historial, Date.now());
      el("resumen").textContent = "Hoy: " + hoy.sesiones + " sesiones, " + hoy.minutos + " minutos.";
      el("lista").replaceChildren(...historial.slice(-5).reverse().map((sesion) => {
        const li = document.createElement("li");
        const fecha = document.createElement("span");
        const duracion = document.createElement("span");
        fecha.textContent = new Date(sesion.fin).toLocaleString("es");
        duracion.textContent = sesion.minutos + " min";
        li.append(fecha, duracion);
        return li;
      }));
    }

    function detener() {
      clearInterval(intervalo);
      intervalo = null;
      finEn = null;
    }

    function cambiarFase(nueva) {
      detener();
      fase = nueva;
      restante = DURACIONES[nueva];
      pintar();
    }

    function completar() {
      if (fase === "trabajo") {
        completados += 1;
        historial.push({ fin: Date.now(), minutos: DURACIONES.trabajo / 60 });
        guardar();
        pintarHistorial();
      }
      cambiarFase(siguienteFase(fase, completados));
    }

    function avanzar() {
      restante = (finEn - Date.now()) / 1000;
      if (restante <= 0) completar();
      else pintar();
    }

    el("alternar").addEventListener("click", () => {
      if (finEn) {
        restante = (finEn - Date.now()) / 1000;
        detener();
      } else {
        finEn = Date.now() + restante * 1000;
        intervalo = setInterval(avanzar, 250);
      }
      pintar();
    });

    el("saltar").addEventListener("click", () => cambiarFase(siguienteFase(fase, completados)));
    el("reiniciar").addEventListener("click", () => cambiarFase(fase));
    el("exportar").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([historialACSV(historial)], { type: "text/csv" }));
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = "historial-pomodoro.csv";
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    el("borrar").addEventListener("click", () => {
      historial = [];
      guardar();
      pintarHistorial();
    });

    pintar();
    pintarHistorial();
  </script>
</body>
</html>
